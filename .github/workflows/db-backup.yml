# Backup berkala database Supabase (data saja; skema ada di supabase/migrations).
# Hasil dump DIENKRIPSI (AES-256, gpg) sebelum disimpan sebagai artifact GitHub selama 30 hari.
# GitHub hanya menyimpan salinan cadangan terenkripsi — BUKAN database transaksi.
#
# Secrets yang diperlukan (Settings › Secrets and variables › Actions):
#   SUPABASE_DB_URL     : connection string Postgres (Project Settings › Database › Connection string, mode session)
#   BACKUP_PASSPHRASE   : kata sandi enkripsi backup (simpan juga di tempat aman terpisah)
name: Backup database
on:
  schedule:
    - cron: '17 19 * * *'   # setiap hari 02:17 WIB
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Periksa secrets
        id: check
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "::notice::Backup dilewati: isi secrets SUPABASE_DB_URL dan BACKUP_PASSPHRASE untuk mengaktifkannya."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pasang pg_dump 17
        if: steps.check.outputs.ready == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-client-17
      - name: Dump & enkripsi
        if: steps.check.outputs.ready == 'true'
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d-%H%M)
          mkdir -p backup
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --data-only --schema=public --format=custom --no-owner --no-privileges -f backup/public-$STAMP.dump
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --data-only --table=auth.users --table=auth.identities --format=custom --no-owner --no-privileges -f backup/auth-$STAMP.dump
          tar -czf backup-$STAMP.tar.gz backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o noura-backup-$STAMP.tar.gz.gpg backup-$STAMP.tar.gz
          rm -rf backup backup-$STAMP.tar.gz
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: noura-backup-${{ env.STAMP }}
          path: noura-backup-*.tar.gz.gpg
          retention-days: 30
