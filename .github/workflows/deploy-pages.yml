# Publikasikan aplikasi ke GitHub Pages dengan konfigurasi Supabase dari repository variables.
# Variables (BUKAN secrets, karena tidak sensitif): SUPABASE_URL, SUPABASE_ANON_KEY.
# Aktifkan: Settings › Pages › Source: GitHub Actions.
name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buat js/env.js (menolak service role key)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          APP_ENV: production
        run: node scripts/build-env.mjs
      - name: Siapkan file situs
        run: |
          mkdir -p _site
          cp -r index.html manifest.json service-worker.js css js vendor assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
